name: CI

on:
  # PR branches are covered by pull_request; push only for main, so each PR runs CI once.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the E2E step compares with the base commit

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags e2e ./...

      - name: Build
        run: go build -o skill-atlas .

      - name: Unit tests
        run: go test -v ./...

      # One E2E run makes ~600 GitHub API requests, and the Actions token allows 1,000 an hour per
      # repository, shared by all runs. So the E2E tests run only when the CLI or this workflow
      # changed (spec cli.md §5); vet, build and unit tests always run.
      - name: Did the CLI change?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if files=$(git diff --name-only "$BASE...HEAD" -- '*.go' go.mod go.sum .github/workflows/ci.yml); then
            echo "$files"
            if [ -n "$files" ]; then echo "e2e=true" >> "$GITHUB_OUTPUT"; else echo "e2e=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "Cannot compare with $BASE; running the E2E tests."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

      # Shows which token the E2E tests get and how much of its hourly budget is left
      # (GET /rate_limit itself is free).
      - name: E2E token and API budget
        if: steps.changes.outputs.e2e == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SOURCE: ${{ secrets.E2E_GITHUB_TOKEN != '' && 'the E2E_GITHUB_TOKEN secret' || 'the Actions token (E2E_GITHUB_TOKEN is not set)' }}
        run: |
          echo "Token: $SOURCE"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/rate_limit |
            jq -r 'if .resources then .resources.core | "Budget: \(.remaining)/\(.limit) left, resets \(.reset | todate)" else "rate_limit: \(.message)" end' || true

      - name: E2E tests (JetBrains repos)
        if: steps.changes.outputs.e2e == 'true'
        run: go test -tags e2e -v ./...
        env:
          # E2E_GITHUB_TOKEN (a read-only fine-grained PAT, see spec cli.md §5) has its own hourly budget.
          # Without it, the built-in Actions token is used: 1,000 requests an hour per repository.
          GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The PR demo as a deterministic Playwright test with screenshot comparison (webui/e2e). The
  # pinned container gives identical rendering on every run; baselines only ever come from it.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Demo and screenshot comparison
        run: npm run test:visual

      - name: Upload results (video, screenshots, diffs, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            webui/test-results/
            webui/playwright-report/
          retention-days: 14

  # Publishes the demo GIF and any screenshot differences to the pr-assets branch and keeps one
  # sticky PR comment up to date. Not a required check; approval happens via the PR label.
  visual-report:
    needs: visual
    timeout-minutes: 10
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: visual-results
          path: visual-results

      - name: Publish demo and differences
        run: bash .github/scripts/visual-report.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.visual.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
