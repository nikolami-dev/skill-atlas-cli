name: CI

on:
  # PR branches are covered by pull_request; push only for main, so each PR runs CI once.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags e2e ./...

      - name: Build
        run: go build -o skill-atlas .

      - name: Unit tests
        run: go test -v ./...

      - name: E2E tests (JetBrains repos)
        run: go test -tags e2e -v ./...
        env:
          # The built-in Actions token lifts the anonymous 60 req/h API limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
