name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags e2e ./...

      - name: Build
        run: go build -o skill-atlas .

      - name: Unit tests
        run: go test -v ./...

      - name: E2E tests (JetBrains repos)
        run: go test -tags e2e -v ./...
        env:
          # The built-in Actions token lifts the anonymous 60 req/h API limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
