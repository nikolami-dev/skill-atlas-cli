name: Approve screenshots

# Adding the label `approve-screenshots` to a PR accepts its visual changes: the baselines are
# regenerated in the same pinned Playwright container as the `visual` CI job and committed to the PR
# branch. GitHub then holds the CI run for that bot commit until a maintainer clicks
# "Approve and run workflows" — the second, deliberate approval click. (A workflow_dispatch run does
# not count as the PR's checks, so there is no way around that click without a personal token.)
# Approving is the reviewer's decision; agents must never add this label themselves.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: approve-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event.label.name == 'approve-screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Regenerate baselines (functional assertions must still pass)
        run: npm run test:visual:update

      - uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: webui/e2e/__screenshots__/
          retention-days: 3

  commit:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      APPROVER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      # Replace, don't merge: renamed or removed screenshots must not leave stale baselines behind.
      - name: Clear old baselines
        run: rm -rf webui/e2e/__screenshots__

      - uses: actions/download-artifact@v4
        with:
          name: baselines
          path: webui/e2e/__screenshots__/

      - name: Commit the approved baselines
        run: |
          # Only approve what was reviewed: stop if the branch moved after the label was added.
          if [ "$(git rev-parse HEAD)" != "$REVIEWED_SHA" ]; then
            gh pr comment "$PR" --body "⚠️ Not approved: \`$BRANCH\` moved after the label was added. Wait for CI on the new commit, then add \`approve-screenshots\` again."
            gh pr edit "$PR" --remove-label approve-screenshots
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A webui/e2e/__screenshots__/
          if git diff --cached --quiet; then
            echo "Baselines already match; nothing to commit."
          else
            git commit -q -m "Approve visual changes (label by @$APPROVER)"
            git push -q origin "HEAD:$BRANCH"
          fi

      - name: Remove the label and ask for the CI approval click
        run: |
          gh pr edit "$PR" --remove-label approve-screenshots
          gh pr comment "$PR" --body "✅ Visual changes approved by @$APPROVER; baselines committed as \`$(git rev-parse --short HEAD)\`.
          **Next:** GitHub holds CI for this bot commit — open the PR's checks and click **Approve and run workflows**. The \`visual\` check then compares against the new baselines."
